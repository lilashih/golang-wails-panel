name: "Github Actions CI"

on:
  push:
    branches: 
      - '**'
  pull_request:
    branches:
      - master

env:
  MATRIX: "{\"os-ubuntu\":[\"ubuntu-22.04\"], \"os-windows\":[\"windows-latest\"], \"go\":[\"1.24.0\"]}"

jobs:
  set_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build_windows:
    needs: set_matrix
    runs-on: ${{ matrix.os-windows }}
    strategy:
      matrix: ${{ fromJson(needs.set_matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/composite/setup
        with:
          env-path: ".env.dev"

      - name: Build windows-exe
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          wails build

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_linux:
    needs:
      - set_matrix
      - build_windows
    runs-on: ${{ matrix.os-ubuntu }}
    strategy:
      matrix: ${{ fromJson(needs.set_matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup
        uses: ./.github/composite/setup
        with:
          env-path: ".env.dev"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev

      - name: Build linux-bin
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          wails build

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_linux_appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux AppImage
        shell: bash
        run: |
          docker buildx build --pull \
            --build-arg TARGETARCH=amd64 \
            -f ./scripts/Dockerfile.linux-appimage \
            --output type=local,dest=./release \
            .
          docker builder prune -af

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: golang-wails-panel-appimage-amd64
          path: release/*.AppImage
          if-no-files-found: error

  test:
    needs: set_matrix
    runs-on: ${{ matrix.os-windows }}
    strategy:
      matrix: ${{ fromJson(needs.set_matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/composite/setup
        with:
          env-path: ".env.dev"

      - name: Execute tests
        # continue-on-error: true
        run: |
          go test -v ./test/...
