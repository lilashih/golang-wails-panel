name: "Github Actions CI"

on:
  push:
    branches: 
      - '**'
  pull_request:
    branches:
      - master

env:
  MATRIX: "{\"os-ubuntu\":[\"ubuntu-22.04\"], \"os-windows\":[\"windows-latest\"], \"go\":[\"1.24.0\"]}"

jobs:
  set_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build_windows:
    needs: set_matrix
    runs-on: ${{ matrix.os-windows }}
    strategy:
      matrix: ${{ fromJson(needs.set_matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/composite/setup
        with:
          env-path: ".env.example"

      - name: Build windows-exe
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          wails3 build

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: build [skip ci]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_linux:
    needs:
      - set_matrix
      - build_windows
    runs-on: ${{ matrix.os-ubuntu }}
    strategy:
      matrix: ${{ fromJson(needs.set_matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup
        uses: ./.github/composite/setup
        with:
          env-path: ".env.example"

      - name: Build linux-bin
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          wails3 build

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: build [skip ci]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}